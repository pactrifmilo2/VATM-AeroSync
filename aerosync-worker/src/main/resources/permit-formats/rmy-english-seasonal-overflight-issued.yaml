id: rmy-english-seasonal-overflight-issued
extends: airline-generic-seasonal-overflight-issued
priority: 210
detectionPatterns:
  - '(?iu)\b(?:O\s*/\s*F|OF)\s*-\s*\d{1,9}\s*/?\s*[A-Z]\s*/\s*[SW]\s*/\s*20\d{2}\s*VN\b'
  - '(?iu)ICAO\s*(?:CODE)?[ \t]*:[ \t]*RMY\b'
  - '(?isu)^(?!.*(?:\bREV(?:ISION)?\s*\d+\b|\bRVS\s*\d+\b|/\s*REV\d+\b)).*$'
operator:
  fixedValue: RMY
schedule:
  columns:
    effectiveFrom: [Effective from, Eff from]
    effectiveTo: [Effective to, Eff to]
    serviceDays: [Days of services, Day(s) of services]
    fromAirport: [Departure Airport, Dep airport]
    etd: [ETD, EOBT]
    toAirport: [Arrival Airport, Arr airport]
    eta: [ETA, EIBT]
    aircraftType: [Aircraft Type, Aircraft type]
