id: eva-english-seasonal-overflight-issued
extends: airline-generic-seasonal-overflight-issued
priority: 250
detectionPatterns:
  - '(?iu)\b(?:O\s*/\s*F|OF)\s*[-/]?\s*\d{1,9}\s*/?\s*[A-Z]\s*/\s*[SW]\s*/\s*20\d{2}\s*VN'
  - '(?iu)(?:IATA\s*(?:CODE)?\s*:\s*BR\b|ICAO\s*(?:CODE)?\s*:\s*EVA\b|EVA\s+AIRWAYS)'
  - '(?iu)(?:Flight\s+number|Effective\s+from|Days\s+of\s+services)'
  - '(?isu)^(?!.*(?:\bREV(?:ISION)?\s*\d+\b|\bRVS\s*\d+\b|/\s*REV\d+\b)).*$'
operator:
  fixedValue: EVA
schedule:
  columns:
    flightNumber: [Flight number]
    effectiveFrom: [Effective from]
    effectiveTo: [Effective to]
    serviceDays: [Days of services]
    fromAirport: [Departure Airport]
    etd: [ETD]
    toAirport: [Arrival Airport]
    eta: [ETA]
  dateFormats: [dMMMyy, dMMMuuuu, d-MMM-yy, d-MMM-uuuu, d/M/uuuu, d MMM uu, d MMM uuuu]
  includeEta: true
route:
  tableRequired: true
  allowEmpty: false
  filterSchedule: true
aircraft:
  scheduleColumn: ''
  auxiliaryColumns:
    aircraftType: [Aircraft Type]
    registrationMarks: [Registration marks, Registration Mark]
  auxiliaryRequiredColumns: [aircraftType, registrationMarks]
  auxiliaryTypeColumn: aircraftType
  registrationColumn: registrationMarks
  defaultType: ''
validation:
  reviewOnly: false
  allowIataAirports: false