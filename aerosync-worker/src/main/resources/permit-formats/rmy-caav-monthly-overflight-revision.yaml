id: rmy-caav-monthly-overflight-revision
extends: caav-generic-overflight-revision
# Chỉ cao hơn profile CAAV dự phòng; không lấn át QLB hoặc profile chuyên biệt.
priority: 40
detectionPatterns:
  - '(?iu)\b(?:O\s*/\s*F|OF)\s*-\s*\d{1,5}\s*/\s*\d{1,2}\s*/\s*20\d{2}\s*VN\b'
  - '(?iu)IATA\s*(?:CODE)?[ \t]*:[ \t]*TH\b'
  - '(?iu)ICAO\s*(?:CODE)?[ \t]*:[ \t]*RMY\b'
  - '(?iu)(?:\bREVISE#?\b|\bREVISION\b|\bREV(?:ISION)?\s*\d*\b|\bRVS\s*\d*\b|\bREVISED\s+(?:ITEM|SCHEDULE)\b|\bNEW\s+SCHEDULE\b|(?:/|-)\s*REV\d+\b)'
operator:
  fixedValue: RMY
