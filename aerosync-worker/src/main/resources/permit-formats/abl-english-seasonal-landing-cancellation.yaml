id: abl-english-seasonal-landing-cancellation
extends: airline-generic-seasonal-landing-issued
priority: 95

detectionPatterns:
  - '(?iu)CANCELLATION\s+FORM\s+FOR\s+SCHEDULED\s+FLIGHT'
  - '(?iu)\bAIRBUSAN\s+CO\.?\s*,?\s*LTD\.?(?:\s|$)'
  - '(?iu)IATA\s+2\s+LETTER\s+CODE\s*:\s*BX\b'
  - '(?iu)ICAO\s+3\s+LETTER\s+CODE\s*:\s*ABL\b'
  - '(?iu)REF\s+TO\s+PERMIT\s+NUMBER\s*:\s*LD\s*-?\s*\d{1,5}\s*/?\s*[A-Z]\s*/\s*[SW]\s*/\s*20\d{2}\s*VN\b'

permit:
  pattern: '(?iu)REF\s+TO\s+PERMIT\s+NUMBER\s*:\s*LD\s*-?\s*(?<number>\d{1,5})\s*/?\s*(?<version>[A-Z])\s*/\s*(?<season>[SW])\s*/\s*(?<year>20\d{2})\s*VN\b'
  numberGroup: number
  numberTemplate: '{number}{version}'
  sourceTemplate: 'LD-{number}/{version}/{season}/{year}VN'
  normalizedTemplate: 'LD {number}{version}/{season}/CHK/{year}'
  zeroPadGroups:
    number: 4

permitDate:
  source: RAW
  pattern: '(?iu)APPLICATION\s+IS\s+SUBMITTED\s+ON\s*:\s*(?<date>\d{1,2}\s+[A-Z]{3,9}\s+20\d{2})'
  group: date
  formats: [d MMM uuuu, d MMMM uuuu]
  locale: en
  fallbackToDocumentCreatedDate: true

operator:
  fixedValue: ABL

reference:
  source: RAW
  pattern: '(?iu)REF\s+TO\s+PERMIT\s+NUMBER\s*:\s*(?<value>LD\s*-?\s*\d{1,5}\s*/?\s*[A-Z]\s*/\s*[SW]\s*/\s*20\d{2}\s*VN)'
  group: value
  required: true

schedule:
  originalTableContextPatterns:
    - '(?iu)\b2\.?\s*SCHEDULES?\b'
  dateFormats: [dMMMyy, dMMMuu, dMMMuuuu, dMMM uu, dMMM uuuu, d-MMM-yy, d-MMM-uuuu, d/M/uuuu, d MMM uu, d MMM uuuu]
  includeEta: true

validation:
  allowIataAirports: true
  reviewOnly: false
