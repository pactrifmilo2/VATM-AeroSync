id: box-english-seasonal-overflight-issued
extends: airline-generic-seasonal-overflight-issued
priority: 230
detectionPatterns:
  - '(?iu)\b(?:O\s*/\s*F|OF)\s*[-/]?\s*\d{1,9}\s*/?\s*[A-Z]\s*/\s*[SW]\s*/\s*20\d{2}\s*VN'
  - '(?iu)(?:ICAO\s*(?:CODE)?\s*:\s*BOX\b|AEROLOGIC\s+GMBH)'
  - '(?isu)^(?!.*(?:\bREV(?:ISION)?\s*\d+\b|\bRVS\s*\d+\b|/\s*REV\d+\b)).*$'
operator:
  fixedValue: BOX
schedule:
  columns:
