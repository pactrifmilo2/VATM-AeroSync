id: airline-generic-seasonal-overflight-revision
extends: airline-generic-seasonal-overflight-issued
priority: -60
detectionPatterns:
  - '(?iu)\b(?:O\s*/\s*F|OF)\s*[-/]?\s*\d{1,9}\s*/?\s*[A-Z]\s*/\s*[SW]\s*/\s*20\d{2}\s*VN'
  - '(?iu)IATA\s*(?:CODE)?\s*:\s*[A-Z0-9]{2}\b'
  - '(?iu)ICAO\s*(?:CODE)?\s*:\s*[A-Z0-9]{3}\b'
  - '(?iu)(?:\bREV(?:ISION)?\s*\d+\b|\bRVS\s*\d+\b|/\s*REV\d+\b)'
