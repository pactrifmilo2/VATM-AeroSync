id: cqn-english-seasonal-overflight-issued
extends: airline-generic-seasonal-overflight-issued
priority: 220
detectionPatterns:
  - '(?iu)\b(?:O\s*/\s*F|OF)\s*[-/]?\s*\d{1,9}\s*/\s*[A-Z]\s*/\s*[SW]\s*/\s*20\d{2}\s*VN'
  - '(?iu)(?:ICAO\s*(?:CODE)?\s*:\s*CQN\b|CHONGQING\s+AIRLINES)'
  - '(?isu)^(?!.*(?:\bREV(?:ISION)?\s*\d*\b|\bRVS\s*\d*\b|/\s*REV\d+\b)).*$'
operator:
  fixedValue: CQN
schedule:
  columns:
    flightNumber: [Flight number, Flight Number]
    effectiveFrom: [Effective from]
    effectiveTo: [Effective to, Effective To]
    serviceDays: [Days of services, Day(s) of services]
    fromAirport: [Departure Airport]
    etd: [ETD, EOBT]
    toAirport: [Arrival Airport]
    eta: [ETA, EIBT]
  includeEta: true
  purposeId: PAX
route:
  columns:
    sector: [Sector, Sectors]
    airways: [Airways, Airway]
  tableRequired: true
  allowEmpty: false
  filterSchedule: true
aircraft:
  scheduleColumn: ''
  auxiliaryColumns:
    aircraftType: [Aircraft Type]
    registrationMarks: [Registration Mark, Registration marks]
  auxiliaryRequiredColumns: [aircraftType]
  auxiliaryTypeColumn: aircraftType
  registrationColumn: registrationMarks
  defaultType: A320
