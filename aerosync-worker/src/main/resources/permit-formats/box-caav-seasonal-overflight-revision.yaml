id: box-caav-seasonal-overflight-revision
extends: caav-generic-seasonal-overflight-revision
# Chỉ cao hơn profile CAAV dự phòng; không lấn át QLB hoặc profile chuyên biệt.
priority: 40
detectionPatterns:
  - '(?iu)\b(?:O\s*/\s*F|OF)\s*[-/]?\s*\d{1,9}\s*/\s*[A-Z]\s*/\s*[SW]\s*/\s*20\d{2}\s*VN\b'
  - '(?iu)IATA\s*(?:CODE)?[ \t]*:[ \t]*3S\b'
  - '(?iu)ICAO\s*(?:CODE)?[ \t]*:[ \t]*BOX\b'
  - '(?iu)(?:\bREVISE#?\b|\bREVISION\b|\bREV(?:ISION)?\s*\d*\b|\bRVS\s*\d*\b|\bREVISED\s+(?:ITEM|SCHEDULE)\b|\bNEW\s+SCHEDULE\b|(?:/|-)\s*REV\d+\b)'
operator:
  fixedValue: BOX
permit:
  pattern: '(?iu)\\b(?:O\\s*/\\s*F|OF)\\s*[-/]?\\s*(?<number>\\d{1,9})\\s*/\\s*(?<version>[A-Z])\\s*/\\s*(?<season>[SW])\\s*/\\s*(?<year>20\\d{2})\\s*VN\\s*/\\s*REV(?<revision>\\d+)\\b'
  numberGroup: number
  numberTemplate: '{number}{version}'
  sourceTemplate: 'OF-{number}/{version}/{season}/{year}VN/REV{revision}'
  normalizedTemplate: 'O/F {number}{version}/{season}/CHK/{year}'
  zeroPadGroups:
    number: 4
