id: apz-english-seasonal-landing-issued
extends: airline-generic-seasonal-landing-issued
priority: 220
detectionPatterns:
  - '(?iu)\bLD\s*[-/]?\s*\d{1,9}\s*/\s*[A-Z]\s*/\s*[SW]\s*/\s*20\d{2}\s*VN'
  - '(?iu)(?:ICAO\s*(?:CODE)?\s*:\s*APZ\b|AIR\s+PREMIA)'
  - '(?iu)(?:IATA\s*(?:CODE)?\s*:\s*YP\b)'
  - '(?isu)^(?!.*(?:\bREV(?:ISION)?\s*\d*\b|\bRVS\s*\d*\b|/\s*REV\d+\b)).*$'
operator:
  fixedValue: APZ
schedule:
  columns:
    etd: [ETD, EOBT]
    eta: [ETA, EIBT]
aircraft:
  auxiliaryColumns:
    aircraftType: [Aircraft Type]
    registrationMarks: [Aircraft registration mark, Registration marks]
  auxiliaryRequiredColumns: [aircraftType]
  auxiliaryTypeColumn: aircraftType
  defaultType: A320
