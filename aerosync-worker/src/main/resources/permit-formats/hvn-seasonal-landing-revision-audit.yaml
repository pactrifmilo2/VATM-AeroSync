id: hvn-seasonal-landing-revision-audit
extends: caav-generic-seasonal-landing-revision
priority: 35
detectionPatterns:
  - '(?iu)\bLD\s*[-/]?\s*\d{1,5}\s*/\s*[A-Z]\s*/\s*[SW]\s*/\s*20\d{2}\s*VN'
  - '(?iu)ICAO\s*(?:CODE)?(?:\s*\([^)]*\))?\s*:\s*HVN\b'
  - '(?iu)(?:NEW\s+SCHEDULE|OLD\s+SCHEDULE|ORIGINAL\s+SCHEDULE|REVISED\s+(?:ITEM|DESTINATION)|LỊCH\s+BAY\s+(?:GỐC|MỚI))'
operator:
  fixedValue: HVN
route:
  filterSchedule: false
  lastMatchingTable: true
validation:
  reviewOnly: true
