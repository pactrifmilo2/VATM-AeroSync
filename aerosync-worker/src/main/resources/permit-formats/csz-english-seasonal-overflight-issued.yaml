id: csz-english-seasonal-overflight-issued
extends: airline-generic-seasonal-overflight-issued
priority: 230
detectionPatterns:
  - '(?iu)\b(?:O\s*/\s*F|OF)\s*[-/]?\s*\d{1,9}\s*/?\s*[A-Z]\s*/\s*[SW]\s*/\s*20\d{2}\s*VN'
  - '(?iu)ICAO\s*(?:CODE)?\s*:\s*CSZ\b'
  - '(?isu)^(?!.*(?:\bREV(?:ISION)?\s*\d+\b|\bRVS\s*\d+\b|/\s*REV\d+\b)).*$'
operator:
  fixedValue: CSZ
schedule:
  columns:
    etd: [ETD, EOBT]
    eta: [ETA, EIBT]
aircraft:
  defaultType: A320