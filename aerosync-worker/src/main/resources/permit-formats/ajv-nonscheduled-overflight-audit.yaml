id: ajv-nonscheduled-overflight-audit
extends: caav-generic-overflight-issued
priority: 35
detectionPatterns:
  - '(?iu)\b(?:O\s*/\s*F|OF)\s*-\s*\d{1,9}\s*/\s*\d{1,2}\s*/\s*20\d{2}\s*VN'
  - '(?iu)ICAO\s*(?:CODE)?\s*:\s*AJV\b'
  - '(?iu)SCHEDULES?'
operator:
  fixedValue: AJV
schedule:
  includeEta: true
  dateFormats: [dMMMyy, dMMMuuuu, d-MMM-yy, d-MMM-uuuu, d/M/uuuu, d MMM uuuu]
  preferredTableContextPatterns: ['(?iu)2\.2\.?\s*NEW']
  originalTableContextPatterns: ['(?iu)2\.1\.?\s*ORIGINAL']
validation:
  reviewOnly: true
