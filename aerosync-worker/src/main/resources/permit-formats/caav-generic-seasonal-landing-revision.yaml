id: caav-generic-seasonal-landing-revision
extends: caav-generic-landing-revision
priority: -90

detectionPatterns:
  - '(?iuU)(?:№\s*[:.]?\s*)?\bLD\s*[-/]?\s*(?:№\s*[:.]?\s*)?\d{1,9}\s*/\s*[A-Z]\s*/\s*[SW]\s*/?\s*20\d{2}\s*VN'
  - '(?iu)(?:\bREV(?:ISION)?\s*\d*\b|\bRVS\s*\d*\b|\bREVISED\s+ITEM\b|\bORIGINAL\s+SCHEDULE|\bNEW\s+SCHEDULE|Lá»ŠCH\s+BAY\s+(?:CÅ¨|Má»šI))'

permit:
  pattern: '(?iuU)(?:№\s*[:.]?\s*)?\bLD\s*[-/]?\s*(?:№\s*[:.]?\s*)?(?=(?<numberRaw>\d{1,9})\s*/)(?<number>\d{1,9})\s*/\s*(?<version>[A-Z])\s*/\s*(?<season>[SW])\s*/?\s*(?<year>20\d{2})\s*VN'
  numberGroup: number
  numberTemplate: '{number}{version}'
  sourceTemplate: 'LD-{numberRaw}/{version}/{season}/{year}VN'
  normalizedTemplate: 'LD {number}{version}/{season}/CHK/{year}'
  zeroPadGroups:
    number: 4

permitDate:
  source: RAW
  pattern: '(?iu)(?<date>(?<!\d)\d{1,2}/\d{1,2}/20\d{2}|\d{1,2}-[A-Z]{3}-\d{2,4}|\d{1,2}\s+[A-Z]{3}\s+20\d{2}|\d{1,2}[A-Z]{3}20\d{2})'
  group: date
  formats: [d/M/uuuu, d-MMM-uu, d-MMM-uuuu, d MMM uuuu, dMMMuuuu]
  locale: en
  fallbackToDocumentCreatedDate: true

schedule:
  columns:
    aircraftType: [Aircraft Type, Aircraft type, Aircraft Type (ICAO code), Aircraft type (ICAO code), Aircrafl Type, Aircraft Tyoe, Aircraft Model, Type of Aircraft]
  preferredTableContextPatterns:
    - '(?iu)(?:2\.?2\.?\s*)?(?:NEW|REVISED)\s+SCHEDULE'
    - '(?iu)(?:2\.?2\.?\s*)?Lá»ŠCH\s+BAY\s+Má»šI'
  dateFormats: [dMMMyy, dMMMuuuu, d-MMM-yy, d-MMM-uuuu, d/M/uuuu, d MMM uu, d MMM uuuu]
  lastMatchingTable: true

route:
  columns:
    sector: [Sector, Sectors, Setor, Setors, Flight Sector, Chặng bay]
    airways: [Airways, Airway, ATS Route, Route (ATS), Đường hàng không]

aircraft:
  auxiliaryColumns:
    aircraftType: [Aircraft Type, Aircraft type, Aircraft Type (ICAO code), Aircraft type (ICAO code), Aircrafl Type, Aircraft Tyoe, Aircraft Model, Type of Aircraft]
    registrationMarks: [Registration Mark, Registration Marks, Aircraft registration mark, Aircraft registration marks, Aircraft Registralion Mark]

validation:
  reviewOnly: true
  allowIataAirports: false
