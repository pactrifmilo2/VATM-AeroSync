id: cxa-english-seasonal-overflight-issued
extends: airline-generic-seasonal-overflight-issued
priority: 230
detectionPatterns:
  - '(?iu)\b(?:O\s*/\s*F|OF)\s*[-/]?\s*\d{1,5}\s*/?\s*[A-Z]\s*/\s*[SW]\s*/\s*20\d{2}\s*VN'
  - '(?iu)(?:ICAO\s*(?:CODE)?\s*:\s*CXA\b|XIAMEN\s+AIRLINES)'
  - '(?iu)(?:Flight\s+Number|Effective\s+from|Day\(s\)\s+of\s+services)'
operator:
  fixedValue: CXA
