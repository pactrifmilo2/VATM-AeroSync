id: hmz-caav-overflight-issued
extends: caav-generic-overflight-issued-na-operator
priority: 220
detectionPatterns:
  - '(?iu)\b(?:O\s*/\s*F|OF)\s*-\s*\d{1,9}\s*/\s*\d{1,2}\s*/\s*20\d{2}\s*VN'
  - '(?iu)ICAO\s*(?:CODE)?[ \t]*:[ \t]*HMZ\b'
  - '(?iu)ZAFER\s+HAVACILIK'
  - '(?iu)OVERFLIGHT\s+PERMIT\s+FOR\s+NON[-\s]+SCHEDULED\s+FLIGHT'
operator:
  fixedValue: HMZ
schedule:
  columns:
    etd: [ETD, EOBT]
    eta: [ETA, EIBT]
route:
  tableRequired: false
  allowEmpty: true
  filterSchedule: false
validation:
  reviewOnly: true
