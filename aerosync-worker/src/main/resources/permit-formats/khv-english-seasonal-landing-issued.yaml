id: khv-english-seasonal-landing-issued
extends: airline-generic-seasonal-landing-issued
priority: 220
detectionPatterns:
  - '(?iu)\bLD\s*[-/]?\s*\d{1,9}\s*/\s*[A-Z]\s*/\s*[SW]\s*/\s*20\d{2}\s*VN'
  - '(?iu)(?:ICAO\s*(?:CODE)?\s*:\s*KHV\b|AIR\s+CAMBODIA)'
  - '(?iu)(?:IATA\s*(?:CODE)?\s*:\s*K6\b)'
  - '(?isu)^(?!.*(?:\bREV(?:ISION)?\s*\d*\b|\bRVS\s*\d*\b|/\s*REV\d+\b)).*$'
operator:
  fixedValue: KHV
schedule:
  columns:
    flightNumber: [Flight number, Flight Number]
    effectiveFrom: [Effective from, Effective From]
    effectiveTo: [Effective to, Effective To]
    fromAirport: [Departure Airport]
    etd: [ETD, EOBT]
    toAirport: [Arrival Airport]
    eta: [ETA, EIBT]
  requiredColumns: [flightNumber, effectiveFrom, effectiveTo, fromAirport, etd, toAirport]
  includeEta: true
route:
  columns:
    sector: [Sector, Sectors]
    airways: [Airways]
  requiredColumns: [sector, airways]
  tableRequired: false
  allowEmpty: true
  filterSchedule: false
aircraft:
  auxiliaryColumns:
    aircraftType: [Aircraft Type]
  auxiliaryRequiredColumns: [aircraftType]
  auxiliaryTypeColumn: aircraftType
  defaultType: A321
validation:
  allowIataAirports: true
