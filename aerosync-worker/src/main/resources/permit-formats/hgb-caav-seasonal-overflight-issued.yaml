id: hgb-caav-seasonal-overflight-issued
extends: airline-generic-seasonal-overflight-issued
priority: 40
detectionPatterns:
  - '(?iu)\b(?:O\s*/\s*F|OF)\s*[-/]?\s*\d{1,5}\s*/?\s*[A-Z]\s*/\s*[SW]\s*/\s*20\d{2}\s*VN'
  - '(?iu)ICAO\s*(?:CODE)?\s*:\s*HGB\b'
  - '(?iu)SCHEDULES?'
  - '(?isu)^(?!.*(?:APPLICATION\s+(?:FORM|FOR)|\bREV(?:ISION)?\s*\d+\b|\bRVS\s*\d+\b)).*$'
operator:
  fixedValue: HGB
schedule:
  columns:
    etd: [ETD, EOBT]
    eta: [ETA, EIBT]
aircraft:
  defaultType: ''
