id: caav-english-issued-permit-revision
detectionPatterns:
  - '(?iu)REFER\s+TO\s+THE\s+ISSUED\s+PERMIT:\s*LD\s*-\s*\d{1,4}/A/S/20\d{2}VN'
  - '(?iu)2\.2\.\s*NEW\s+SCHEDULE'
permit:
  pattern: '(?iu)\bLD\s*-\s*(?=(?<numberRaw>\d{1,4})/)(?<number>\d{1,4})/(?<version>A)/(?<season>S)/(?<year>20\d{2})VN\b'
  numberGroup: number
  numberTemplate: '{numberRaw}{version}'
  sourceTemplate: 'LD-{numberRaw}/{version}/{season}/{year}VN'
  normalizedTemplate: 'LD {number}{version}/{season}/CHK/{year}'
  zeroPadGroups:
    number: 4
permitDate:
  source: PARAGRAPH
  pattern: '(?iu)HANOI\s*,\s*(?<date>\d{1,2}/\d{1,2}/20\d{2})'
  group: date
  formats: [d/M/uuuu]
  locale: en
operator:
  source: TABLE
  pattern: '(?iu)ICAO\s*CODE:\s*(?<value>[A-Z0-9]{3})'
  group: value
  required: true
billingAddress:
  source: TABLE
  pattern: '(?iu)POSTAL\s+ADDRESS:\s*(?<value>[^\n]+)'
  group: value
  required: false
reference:
  source: PARAGRAPH
  pattern: '(?iu)REFER\s+TO\s+THE\s+ISSUED\s+PERMIT:\s*(?<value>LD\s*-\s*\d{1,4}/A/S/20\d{2}VN)'
  group: value
  required: true
master:
  authorId: CHK
  permitType: LD
  version: A
  season: S
  validHours: 24
  flightType: SC
schedule:
  columns:
    flightNumber: [Flight number]
    effectiveFrom: [Effective from]
    effectiveTo: [Effective to]
    serviceDays: [Days of services]
    fromAirport: [Departure Airport]
    etd: [ETD]
    toAirport: [Arrival Airport]
    eta: [ETA]
    aircraftType: [Aircraft Type]
    originalPermit: [Original permit, 'Original permit(3)']
  requiredColumns:
    - flightNumber
    - effectiveFrom
    - effectiveTo
    - serviceDays
    - fromAirport
    - etd
    - toAirport
    - eta
    - aircraftType
  excludeColumns: [originalPermit]
  tableContextPatterns:
    - '(?iu)2\.2\.\s*NEW\s+SCHEDULE'
  dateFormats: [dMMMyy, d-MMM-yy, d/M/uuuu]
  timeFormats: [HHmm, H:mm, HH:mm]
  locale: en
  purposeId: PAX
  includeEta: true
route:
  columns:
    sector: [Sector]
    airways: [Airways]
  requiredColumns: [sector, airways]
  tableRequired: false
  allowEmpty: true
  fallbackToFirst: false
aircraft:
  scheduleColumn: aircraftType
  auxiliaryColumns: {}
  auxiliaryRequiredColumns: []
  remarkPrefix: PAX
validation:
  allowIataAirports: true
