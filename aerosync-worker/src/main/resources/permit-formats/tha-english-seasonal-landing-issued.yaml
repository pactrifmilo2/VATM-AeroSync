id: tha-english-seasonal-landing-issued
extends: airline-generic-seasonal-landing-issued
priority: 200
detectionPatterns:
  - '(?iu)\bLD\s*[-/]?\s*\d{1,9}\s*/\s*[A-Z]\s*/\s*[SW]\s*/\s*20\d{2}\s*VN'
  - '(?iu)(?:ICAO(?:\s*/\s*ICAO)?\s*(?:CODE)?\s*:\s*THA\b|THAI\s+AIRWAYS)'
  - '(?isu)^(?!.*(?:\bREV(?:ISION)?\s*\d*\b|\bRVS\s*\d*\b|/\s*REV\d+\b)).*$'
operator:
  fixedValue: THA
aircraft:
  auxiliaryColumns:
    aircraftType: [Aircraft Type, Aircraft Type (IATA code)]
    registrationMarks: [Registration Mark, Registration Marks, Aircraft registration mark]
  auxiliaryRequiredColumns: [aircraftType]
  auxiliaryTypeColumn: aircraftType
  defaultType: B77W
