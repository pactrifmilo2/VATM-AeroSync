id: lj-english-landing-revision
extends: caav-generic-landing-revision
priority: 260
detectionPatterns:
  - '(?iu)\bLD\s*-?\s*\d{1,9}\s*/\s*\d{1,2}\s*/\s*20\d{2}\s*VN\b'
  - '(?iu)(?:IATA\s*(?:CODE)?\s*:\s*LJ\b|\bJIN\s+AIR\b|\bLJ\d{3,4}\b)'
  - '(?iu)(?:CHG\s+SUBJECT|SKD\s+CHANGE|CHANGE|ORIGINAL\s+SKED)'
operator:
  fixedValue: JNA
schedule:
  columns:
    flightNumber: [Flight number, Flight no, Flt number]
  tableContextPatterns: []
  preferredTableContextPatterns: []
  dateFormats: [dMMMyy, dMMMuuuu, d-MMM-yy, d-MMM-uuuu, d/M/uuuu]
validation:
  reviewOnly: true
