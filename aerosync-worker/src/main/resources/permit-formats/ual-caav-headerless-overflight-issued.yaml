id: ual-caav-headerless-overflight-issued
extends: caav-generic-overflight-issued
priority: 40
detectionPatterns:
  - '(?iu)\b(?:O\s*/\s*F|OF)\s*-\s*\d{1,5}\s*/\s*\d{1,2}\s*/\s*20\d{2}\s*VN\b'
  - '(?iu)ICAO\s*(?:CODE)?\s*:\s*UAL\b'
  - '(?iu)SCHEDULES?'
  - '(?isu)^(?!.*(?:\bREV(?:ISION)?\s*\d+\b|\bRVS\s*\d+\b)).*$'
operator:
  fixedValue: UAL
schedule:
  headerlessColumns:
    flightNumber: 0
    effectiveFrom: 1
    effectiveTo: 2
    serviceDays: 3
    fromAirport: 4
    etd: 5
    toAirport: 6
    eta: 7
    aircraftType: 8
  tableContextPatterns:
    - '(?iu)2\.\s*SCHEDULES'
  includeEta: true
aircraft:
  defaultType: ''
