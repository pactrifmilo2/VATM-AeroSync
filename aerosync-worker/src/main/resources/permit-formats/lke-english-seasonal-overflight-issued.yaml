id: lke-english-seasonal-overflight-issued
extends: airline-generic-seasonal-overflight-issued
priority: 200
detectionPatterns:
  - '(?iu)\b(?:O\s*/\s*F|OF)\s*[-/]?\s*\d{1,9}\s*/\s*[A-Z]\s*/\s*[SW]\s*/\s*20\d{2}\s*VN'
  - '(?iu)(?:ICAO\s*(?:CODE)?\s*:\s*LKE\b|LUCKY\s+AIR)'
  - '(?isu)^(?!.*(?:\bREV(?:ISION)?\s*\d*\b|\bRVS\s*\d*\b|/\s*REV\d+\b)).*$'
operator:
  fixedValue: LKE
aircraft:
  auxiliaryColumns:
    aircraftType: [Aircraft Type, A/C TYPE]
    registrationMarks: [Registration Mark, Registration Marks, A/C REG]
  auxiliaryRequiredColumns: [aircraftType]
  auxiliaryTypeColumn: aircraftType
  defaultType: A20N
