id: qtr-caav-seasonal-overflight-issued
extends: airline-generic-seasonal-overflight-issued
priority: 205
detectionPatterns:
  - '(?iu)\b(?:O\s*/\s*F|OF)\s*[-/]\s*\d{1,9}\s*/\s*[A-Z]\s*/\s*[SW]\s*/\s*20\d{2}\s*VN'
  - '(?iu)IATA\s*(?:CODE)?[ \t]*:[ \t]*QR\b'
  - '(?iu)ICAO\s*(?:CODE)?[ \t]*:[ \t]*QTR\b'
  - '(?isu)^(?!.*(?:\bREV(?:ISION)?\s*\d+\b|\bRVS\s*\d+\b)).*$'
operator:
  fixedValue: QTR
schedule:
  columns:
    etd: [ETD, EOBT]
    eta: [ETA, EIBT]
validation:
  reviewOnly: true
