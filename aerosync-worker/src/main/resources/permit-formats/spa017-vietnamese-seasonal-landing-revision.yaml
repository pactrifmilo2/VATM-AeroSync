id: spa017-vietnamese-seasonal-landing-revision
detectionPatterns:
  - '(?iu)PHÉP\s+BAY\s+SỬA\s+ĐỔI'
  - '(?iu)THAM\s+CHIẾU\s+PHÉP\s+BAY\s+SỐ'
  - '(?iu)2\.2\.\s*LỊCH\s+BAY\s+MỚI\s*\(SỬA\s+ĐỔI\)'
permit:
  pattern: '(?iu)\bLD-(?=(?<numberRaw>\d{1,4})/)(?<number>\d{1,4})/(?<version>[A-Z])/(?<season>[SW])/(?<year>20\d{2})VN(?:/REV(?<revision>\d+))?\b'
  numberGroup: number
  numberTemplate: '{numberRaw}{version}'
  normalizedTemplate: 'LD {number}{version}/{season}/CHK/{year}'
  zeroPadGroups:
    number: 4
permitDate:
  source: PARAGRAPH
  pattern: '(?iu)HÀ\s*NỘI,\s*(?<date>\d{1,2}/\d{1,2}/20\d{2})'
  group: date
  formats: [d/M/uuuu]
  locale: vi
operator:
  source: TABLE
  pattern: '(?iu)MÃ\s*ICAO:\s*(?<value>[A-Z0-9]{3})'
  group: value
  required: true
billingAddress:
  source: TABLE
  pattern: '(?iu)ĐỊA\s+CHỈ\s+BƯU\s+ĐIỆN:\s*(?<value>[^\n]+)'
  group: value
  required: false
reference:
  source: PARAGRAPH
  pattern: '(?iu)THAM\s+CHIẾU\s+PHÉP\s+BAY\s+SỐ:\s*(?<value>LD-\d{1,4}/[A-Z]/[SW]/20\d{2}VN)'
  group: value
  required: true
master:
  authorId: CHK
  permitType: LD
  version: B
  season: S
  validHours: 24
  flightType: SC
schedule:
  columns:
    flightNumber: [Số hiệu chuyến bay, Flight number]
    effectiveFrom: [Hiệu lực từ, Effective from]
    effectiveTo: [Hiệu lực đến, Effective to]
    serviceDays: [Ngày trong tuần, Days of services]
    fromAirport: [Sân bay đi, Departure airport]
    etd: [Giờ dự kiến đi, ETD]
    toAirport: [Sân bay đến, Arrival airport]
    eta: [Giờ dự kiến đến, ETA]
  requiredColumns:
    - flightNumber
    - effectiveFrom
    - effectiveTo
    - serviceDays
    - fromAirport
    - etd
    - toAirport
    - eta
  excludeColumns: []
  tableContextPatterns:
    - '(?iu)2\.2\.\s*LỊCH\s+BAY\s+MỚI\s*\(SỬA\s+ĐỔI\)'
  dateFormats: [d-MMM-yy, dMMMyy, d/M/uuuu]
  timeFormats: [HHmm, H:mm, HH:mm]
  locale: en
  purposeId: PAX
  includeEta: true
route:
  columns:
    sector: [Chặng bay, Sector]
    airways: [Đường hàng không, Airways]
  requiredColumns: [sector, airways]
  staticAirways:
    CXR-PQC: W15/W1/W17
    PQC-SGN: W8/W16
  tableRequired: false
  allowEmpty: false
  fallbackToFirst: false
aircraft:
  defaultCraftId: 4366
  defaultMtow: 0
  mappings: []
  auxiliaryColumns: {}
  auxiliaryRequiredColumns: []
  remarkPrefix: PAX 321/32Q/32N
validation:
  allowIataAirports: true
