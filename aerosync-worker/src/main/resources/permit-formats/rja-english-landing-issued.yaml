id: rja-english-landing-issued
extends: caav-generic-landing-issued
priority: 200
detectionPatterns:
  - '(?iu)\bLD\s*-\s*\d+'
  - '(?iu)(?:ICAO\s*(?:CODE)?[ \t]*:[ \t]*RJA\b|ROYAL\s+JORDANIAN)'
  - '(?isu)^(?!.*(?:/|-)\s*REV\d+\b).*$'
operator:
  fixedValue: RJA
aircraft:
  scheduleColumn: aircraftType
  defaultType: B788
  auxiliaryRequiredColumns: []
