id: tha-english-overflight-revision
extends: caav-generic-overflight-revision
priority: 220
detectionPatterns:
  - '(?iu)\b(?:O\s*/\s*F|OF)\s*[-/]?\s*\d{1,9}\s*/\s*[A-Z]\s*/\s*[SW]\s*/\s*20\d{2}VN'
  - '(?iu)(?:ICAO\s*(?:CODE)?\s*:\s*THA\b|THAI\s+AIRWAYS)'
  - '(?iu)(?:REV(?:ISION)?|RVS|CHANGE|SCHEDULE)'
operator:
  fixedValue: THA
validation:
  reviewOnly: true
