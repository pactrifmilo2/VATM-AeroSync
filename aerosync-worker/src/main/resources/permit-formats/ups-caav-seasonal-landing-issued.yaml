id: ups-caav-seasonal-landing-issued
extends: airline-generic-seasonal-landing-issued
priority: 210
detectionPatterns:
  - '(?iu)\bLD\s*[-/]?\s*\d{1,9}\s*/?\s*[A-Z]\s*/\s*[SW]\s*/\s*20\d{2}\s*VN'
  - '(?iu)(?:ICAO\s*(?:CODE)?|M(?:ã|Ã|A)\s*ICAO)\s*:\s*UPS\b'
  - '(?iu)(?:IATA\s*(?:CODE)?|M(?:ã|Ã|A)\s*IATA)\s*:\s*5X\b'
  - '(?iu)(?:SCHEDULES?|LỊCH\s+BAY)'
  - '(?isu)^(?!.*(?:\bREV(?:ISION)?\s*\d+\b|\bRVS\s*\d+\b|/\s*REV\d+\b)).*$'
operator:
  fixedValue: UPS
schedule:
  columns:
    effectiveFrom: [Effective from, Eff from]
    effectiveTo: [Effective to]
    serviceDays: [Days of services]
    departureAirport: [Departure Airport]
    etd: [ETD, EOBT, EOTD]
    arrivalAirport: [Arrival Airport]
    eta: [ETA, EIBT, EIBT]
validation:
  allowIataAirports: true
