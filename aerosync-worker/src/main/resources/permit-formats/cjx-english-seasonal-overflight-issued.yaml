id: cjx-english-seasonal-overflight-issued
extends: airline-generic-seasonal-overflight-issued
priority: 220
detectionPatterns:
  - '(?iu)\b(?:O\s*/\s*F|OF)\s*[-/]?\s*\d{1,9}\s*/\s*[A-Z]\s*/\s*[SW]\s*/\s*20\d{2}\s*VN'
  - '(?iu)(?:ICAO\s*(?:CODE)?\s*:\s*CJX\b|JIANGXI\s+AIR)'
  - '(?isu)^(?!.*(?:\bREV(?:ISION)?\s*\d*\b|\bRVS\s*\d*\b|/\s*REV\d+\b)).*$'
operator:
  fixedValue: CJX
schedule:
  columns:
    flightNumber: [Flight number, Flight number (ICAO code)]
    effectiveFrom: [Effective from, Effective from DDMMMYY]
    effectiveTo: [Effective to, Effective to DDMMMYY]
    serviceDays: [Days of services, Days of services 1234567]
    fromAirport: [Departure Airport, Departure Airport (ICAO code)]
    etd: [ETD, EOBT, EOBT UTC]
    toAirport: [Arrival Airport, Arrival Airport (ICAO code)]
    eta: [ETA, EIBT, EIBT UTC]
  requiredColumns: [flightNumber, effectiveFrom, effectiveTo, serviceDays, fromAirport, etd, toAirport]
  purposeId: PAX
  includeEta: true
route:
  columns:
    sector: [Sector]
    airways: [Airways]
  requiredColumns: [sector, airways]
  tableRequired: false
  allowEmpty: true
  filterSchedule: false
aircraft:
  auxiliaryColumns:
    aircraftType: [Aircraft Type, Aircraft Type (ICAO code)]
    registrationMarks: [Aircraft registration mark, Registration mark]
  auxiliaryRequiredColumns: [aircraftType]
  auxiliaryTypeColumn: aircraftType
  defaultType: B738
