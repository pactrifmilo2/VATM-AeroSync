id: qfa-english-overflight-issued
extends: caav-generic-overflight-issued
priority: 200
detectionPatterns:
  - '(?iu)\bOF\s*-\s*\d+'
  - '(?iu)(?:ICAO\s*(?:CODE)?[ \t]*:[ \t]*QFA\b|QANTAS\s+AIRWAYS)'
  - '(?isu)^(?!.*(?:/REV\d+|\bREVISED\s+ITEM\b)).*$'
permit:
  pattern: '(?iu)\b(?:O\s*/\s*F|OF)\s*-\s*(?<number>\d{1,9}[A-Z]?)'
  numberGroup: number
  sourceTemplate: 'OF-{number}/CHK/{year}'
  normalizedTemplate: 'O/F {number}/CHK/{year}'
  zeroPadGroups:
    number: 5
operator:
  fixedValue: QFA
schedule:
  includeEta: true
aircraft:
  scheduleColumn: aircraftType
  defaultType: B789
  auxiliaryRequiredColumns: []
