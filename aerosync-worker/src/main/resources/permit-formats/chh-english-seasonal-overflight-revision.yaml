id: chh-english-seasonal-overflight-revision
extends: caav-generic-seasonal-overflight-revision
priority: 40

detectionPatterns:
  - '(?iu)\b(?:O\s*/\s*F|OF)\s*[-/]?\s*\d{1,9}\s*/\s*[A-Z]\s*/\s*[SW]\s*/\s*20\d{2}\s*VN'
  - '(?iu)IATA\s*(?:CODE)?[ \t]*:[ \t]*HU\b'
  - '(?iu)ICAO\s*(?:CODE)?[ \t]*:[ \t]*CHH\b'
  - '(?iu)\bORIGINAL\s+SCHEDULE\b'
  - '(?iu)\bREVISED\s+SCHEDULE\b'

operator:
  fixedValue: CHH

schedule:
  preferredTableContextPatterns:
    - '(?iu)(?:2\.?2\.?\s*)?REVISED\s+SCHEDULE'
  lastMatchingTable: true
