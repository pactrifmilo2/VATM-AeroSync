id: dkh-english-seasonal-overflight-revision
extends: caav-generic-seasonal-overflight-revision
priority: 40

detectionPatterns:
  - '(?iu)\b(?:O\s*/\s*F|OF)\s*[-/]?\s*\d{1,5}\s*/\s*[A-Z]\s*/\s*[SW]\s*/\s*20\d{2}\s*VN'
  - '(?iu)IATA\s*(?:CODE)?[ \t]*:[ \t]*HO\b'
  - '(?iu)ICAO\s*(?:CODE)?[ \t]*:[ \t]*DKH\b'
  - '(?iu)\bORIGINAL\s+SCHEDULE\b'
  - '(?iu)\bUPDATED\s+SCHEDULE\b'

operator:
  fixedValue: DKH

schedule:
  preferredTableContextPatterns:
    - '(?iu)(?:2\.?2\.?\s*)?UPDATED\s+SCHEDULE'
  lastMatchingTable: true
