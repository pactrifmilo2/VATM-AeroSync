id: baw-english-seasonal-overflight-issued
extends: airline-generic-seasonal-overflight-issued
priority: 220
detectionPatterns:
  - '(?iu)\b(?:O\s*/\s*F|OF)\s*[-/]?\s*\d{1,9}\s*/\s*[A-Z]\s*/\s*[SW]\s*/\s*20\d{2}\s*VN'
  - '(?iu)(?:ICAO\s*(?:CODE)?\s*:\s*BAW\b|BRITISH\s+AIRWAYS)'
  - '(?isu)^(?!.*(?:\bREV(?:ISION)?\s*\d*\b|\bRVS\s*\d*\b|/\s*REV\d+\b)).*$'
operator:
  fixedValue: BAW
schedule:
  columns:
    flightNumber: [Flight Number, Flight number]
    effectiveFrom: [Effective from]
    effectiveTo: [Effective To, Effective to]
    serviceDays: [Day(s) of services, Days of services]
    fromAirport: [Departure Airport]
    etd: [ETD, EOBT]
    toAirport: [Arrival Airport]
    eta: [ETA, EIBT]
  includeEta: true
  purposeId: PAX
aircraft:
  scheduleColumn: aircraftType
  auxiliaryColumns:
    aircraftType: [Aircraft Type]
    registrationMarks: [Registration marks, Registration Mark]
  auxiliaryRequiredColumns: []
  auxiliaryTypeColumn: aircraftType
  defaultType: A35K
