id: vjc-caav-seasonal-landing-revision
extends: caav-generic-seasonal-landing-revision
# Chỉ cao hơn profile CAAV dự phòng; không lấn át QLB hoặc profile chuyên biệt.
priority: 40
detectionPatterns:
  - '(?iu)\bLD\s*[-/]?\s*\d{1,9}\s*/\s*[A-Z]\s*/\s*[SW]\s*/?\s*20\d{2}\s*VN\b'
  - '(?iu)IATA\s*(?:CODE)?[ \t]*:[ \t]*VJ\b'
  - '(?iu)ICAO\s*(?:CODE)?[ \t]*:[ \t]*VJC\b'
  - '(?iu)(?:\bREVISE#?\b|\bREVISION\b|\bREV(?:ISION)?\s*\d*\b|\bRVS\s*\d*\b|\bREVISED\s+(?:ITEM|SCHEDULE)\b|\bNEW\s+SCHEDULE\b|(?:/|-)\s*REV\d+\b)'
operator:
  fixedValue: VJC
route:
  inlineRules:
  - pattern: '(?imu)(?<route>[A-Z]{3,4}(?:\s*[-\u2013\u2014]\s*[A-Z]{3,4})+)\s*:\s*(?<airways>[^;\r\n]+)'
    routeGroup: route
    valueGroup: airways
