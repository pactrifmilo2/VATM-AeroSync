id: caav-english-overflight-scheduled
family: caav-english
profileVersion: 1
detectionPatterns:
  - '(?iu)SCHEDULES:\s*UTC\s*TIME'
  - '(?iu)CARGO\s+FLIGHT'
  - '(?isu)^(?!.*NON[-\s]+SCHEDULED).*$'
permit:
  pattern: '(?iu)\bOF[-\s]?(?<number>\d{1,5})/(?<month>\d{1,2})/(?<year>20\d{2})VN\b'
  numberGroup: number
  normalizedTemplate: 'O/F {number}/S/CHK/{year}'
  zeroPadGroups:
    number: 5
permitDate:
  source: PARAGRAPH
  pattern: '(?iu)HANOI,\s*(?<date>\d{1,2}-[A-Z]{3}-\d{2,4})'
  group: date
  formats:
    - d-MMM-yy
    - d-MMM-uuuu
  locale: en
operator:
  source: TABLE
  pattern: '(?iu)ICAO\s*CODE:\s*(?<value>[A-Z0-9]{3})'
  group: value
  required: true
billingAddress:
  source: TABLE
  pattern: '(?iu)POSTAL\s+ADDRESS:\s*(?<value>[^\n]+)'
  group: value
  required: false
reference:
  source: PARAGRAPH
  pattern: '(?iu)\(REF\.\s*(?<value>[^)]+)\)'
  group: value
  required: false
master:
  authorId: CHK
  permitType: O/F
  version: A
  season: S
  validHours: 72
  flightType: SC
schedule:
  columns:
    flightNumber: [Flight number]
    effectiveFrom: [Eff from, Effective from]
    effectiveTo: [Eff to, Effective to]
    serviceDays: [Day(s) of services, Days of services]
    fromAirport: [Dep airport, Departure airport]
    etd: [ETD]
    toAirport: [Arr airport, Arrival airport]
    eta: [ETA]
  requiredColumns:
    - flightNumber
    - effectiveFrom
    - effectiveTo
    - serviceDays
    - fromAirport
    - etd
    - toAirport
  excludeColumns: []
  dateFormats:
    - dMMMyy
    - d-MMM-yy
  timeFormats:
    - HHmm
    - H:mm
    - HH:mm
  locale: en
  purposeId: CAR
  includeEta: false
route:
  columns:
    sector: [Sector]
    airways: [Airways]
  requiredColumns: [sector, airways]
  tableRequired: true
  allowEmpty: false
  fallbackToFirst: true
aircraft:
  defaultType: B76X
  auxiliaryColumns:
    aircraftType: [Aircraft type]
    registrationMarks: [Registration marks]
  auxiliaryRequiredColumns: [aircraftType, registrationMarks]
  auxiliaryTypeColumn: aircraftType
  remarkPrefix: CAR
validation:
  allowIataAirports: false
