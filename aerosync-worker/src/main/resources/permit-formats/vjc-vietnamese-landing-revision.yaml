id: vjc-vietnamese-landing-revision
priority: 320
detectionPatterns:
  - '(?iu)M(?:Ã|A)\s*IATA\s*:\s*VJ\b'
  - '(?iu)M(?:Ã|A)\s*ICAO\s*:\s*VJC\b'
  - '(?iu)\bLD-\d{1,9}/\d{1,2}/20\d{2}VN\b'
  - '(?iu)(?:LỊCH\s+BAY\s+SỬA\s+ĐỔI|NỘI\s+DUNG\s+(?:GỐC|MỚI))'
permit:
  pattern: '(?iu)\bLD-(?<number>\d{1,9})/(?<month>\d{1,2})/(?<year>20\d{2})VN\b'
  numberGroup: number
  sourceTemplate: 'LD-{number}/{month}/{year}VN'
  normalizedTemplate: 'LD {number}/CHK/{year}'
  zeroPadGroups:
    number: 5
permitDate:
  source: PARAGRAPH
  pattern: '(?iu)(?<date>\d{1,2}/\d{1,2}/20\d{2})'
  group: date
  formats: [d/M/uuuu]
  locale: vi
operator:
  fixedValue: VJC
billingAddress:
  source: TABLE
  pattern: '(?iu)ĐỊA\s+CHỈ\s+BƯU\s+ĐIỆN[ \t]*:[ \t]*(?<value>[^\n]+)'
  group: value
  required: false
referenceColumn: originalPermit
purpose:
  defaultId: PAX
  mappings:
    - pattern: '(?iu)HÀNG\s+H[ÓOÒ]A'
      value: CAR
    - pattern: '(?iu)CHỞ\s+KHÁCH'
      value: PAX
master:
  authorId: CHK
  permitType: LD
  version: A
  season: S
  validHours: 24
  flightType: 'NO'
schedule:
  columns:
    flightNumber: [Số hiệu chuyến bay]
    effectiveFrom: [Hiệu lực từ]
    effectiveTo: [Hiệu lực đến]
    serviceDays: [Ngày trong tuần]
    fromAirport: [Sân bay cất cánh]
    etd: [Giờ khởi hành dự kiến]
    toAirport: [Sân bay hạ cánh]
    eta: [Giờ hạ cánh dự kiến, Giờ dự kiến hạ cánh]
    aircraftType: [Loại tàu bay, Tàu bay]
    originalPermit: [Số phép, Số phép gốc, Số phép bay, Số phép bay đã cấp, Phép bay liên quan]
  requiredColumns: [flightNumber, effectiveFrom, effectiveTo, serviceDays, fromAirport, etd, toAirport, eta]
  excludeColumns: []
  tableContextPatterns: []
  preferredTableContextPatterns:
    - '(?iu)(?:LỊCH\s+BAY\s+SỬA\s+ĐỔI|NỘI\s+DUNG\s+MỚI)'
  originalTableContextPatterns:
    - '(?iu)NỘI\s+DUNG\s+GỐC'
  dateFormats: [dMMMyy, d-MMM-yy, d/M/uuuu]
  timeFormats: [HHmm, H:mm, HH:mm]
  locale: en
  purposeId: PAX
  includeEta: true
  lastMatchingTable: false
  inferIataPrefix: true
route:
  columns:
    sector: [Chặng bay]
    airways: [Đường hàng không]
  requiredColumns: [sector, airways]
  tableRequired: false
  allowEmpty: true
  fallbackToFirst: false
  lastMatchingTable: false
  filterSchedule: false
aircraft:
  scheduleColumn: aircraftType
  auxiliaryColumns:
    aircraftType: [Loại tàu bay]
    registrationMarks: [Số đăng ký]
  auxiliaryRequiredColumns: [aircraftType]
  auxiliaryTypeColumn: aircraftType
  remarkPrefix: ''
validation:
  allowIataAirports: false
  reviewOnly: false
