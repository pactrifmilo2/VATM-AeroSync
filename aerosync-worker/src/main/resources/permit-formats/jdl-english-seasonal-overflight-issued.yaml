id: jdl-english-seasonal-overflight-issued
extends: airline-generic-seasonal-overflight-issued
priority: 240
detectionPatterns:
  - '(?iu)\b(?:O\s*/\s*F|OF)\s*[-/]?\s*\d{1,9}\s*/?\s*[A-Z]\s*/\s*[SW]\s*/\s*20\d{2}\s*VN\b'
  - '(?iu)(?:ICAO\s*(?:CODE)?\s*:\s*JDL\b|IATA\s*(?:CODE)?\s*:\s*JG\b|JIANGSU\s+JINGDONG|JINGDONG\s+CARGO)'
  - '(?iu)(?:FL(?:IGH)?T\s*NUMBER|SCHEDULES?)'
  - '(?isu)^(?!.*(?:\bREV(?:ISION)?\s*\d*\b|\bRVS\s*\d*\b|/\s*REV\d+\b)).*$'
operator:
  fixedValue: JDL
purpose:
  defaultId: CAR
validation:
  reviewOnly: true
