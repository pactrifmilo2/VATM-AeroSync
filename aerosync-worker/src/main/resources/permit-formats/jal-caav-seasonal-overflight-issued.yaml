id: jal-caav-seasonal-overflight-issued
extends: airline-generic-seasonal-overflight-issued
priority: 210
detectionPatterns:
  - '(?iu)\b(?:O\s*/\s*F|OF)\s*-\s*\d{1,9}\s*/?\s*[A-Z]\s*/\s*[SW]\s*/\s*20\d{2}\s*VN\b'
  - '(?iu)ICAO\s*(?:CODE)?[ \t]*:[ \t]*JAL\b'
  - '(?isu)^(?!.*(?:\bREV(?:ISION)?\s*\d+\b|\bRVS\s*\d+\b|/\s*REV\d+\b)).*$'
operator:
  fixedValue: JAL
schedule:
  columns:
    flightNumber: [Flight number]
    effectiveFrom: [Effective from]
    effectiveTo: [Effective to]
    serviceDays: [Days of services]
    fromAirport: [Departure Airport]
    etd: [ETD, EOBT]
    toAirport: [Arrival Airport]
    eta: [ETA, EIBT]
    aircraftType: [Aircraft Type, AircraftType, Aircraft Type (ICAO code)]
    route: [Sector]
validation:
  allowIataAirports: true
