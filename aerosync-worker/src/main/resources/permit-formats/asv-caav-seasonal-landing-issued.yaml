id: asv-caav-seasonal-landing-issued
extends: airline-generic-seasonal-landing-issued
priority: 210
detectionPatterns:
  - '(?iu)\bLD\s*[-/]?\s*\d{1,9}\s*/\s*[A-Z]\s*/\s*[SW]\s*/\s*20\d{2}\s*VN'
  - '(?iu)IATA\s*(?:CODE)?[ \t]*:[ \t]*RS\b'
  - '(?iu)ICAO\s*(?:CODE)?[ \t]*:[ \t]*ASV\b'
  - '(?iu)AIR\s+SEOUL'
  - '(?isu)^(?!.*(?:\bREV(?:ISION)?\s*\d+\b|\bRVS\s*\d+\b|/\s*REV\d+\b)).*$'
operator:
  fixedValue: ASV
schedule:
  columns:
    etd: [ETD, EOBT, ETD (UTC)]
    eta: [ETA, EIBT, ETA (UTC)]
validation:
  reviewOnly: true