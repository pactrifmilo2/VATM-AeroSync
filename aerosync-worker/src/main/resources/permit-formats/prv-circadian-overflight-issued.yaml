id: prv-circadian-overflight-issued
extends: caav-generic-overflight-issued
priority: 200
detectionPatterns:
  - '(?iu)\b(?:O\s*/\s*F|OF)\s*-\s*\d+'
  - '(?iu)CIRCADIAN\s+AVIATION\s+LLC'
  - '(?isu)^(?!.*(?:/|-)\s*REV\d+\b).*$'
operator:
  fixedValue: PRV
route:
  tableRequired: false
  allowEmpty: true
  fallbackToFirst: true
  filterSchedule: false
