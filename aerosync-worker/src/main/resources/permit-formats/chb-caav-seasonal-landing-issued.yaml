  - '(?iu)(?:ICAO\s*(?:CODE)?|M(?:ã|Ã|A)\s*ICAO)\s*:\s*CHB\b'
  - '(?iu)(?:IATA\s*(?:CODE)?|M(?:ã|Ã|A)\s*IATA)\s*:\s*PN\b'
  - '(?iu)(?:SCHEDULES?|LỊCH\s+BAY)'
  - '(?isu)^(?!.*(?:\bREV(?:ISION)?\s*\d+\b|\bRVS\s*\d+\b|/\s*REV\d+\b)).*$'
operator:
