id: xax-english-overflight-issued
extends: caav-generic-overflight-issued
priority: 280
detectionPatterns:
  - '(?iu)\b(?:OF\s*-?\s*)\d{1,5}\s*/\s*[A-Z]\s*/\s*S\s*/\s*20\d{2}VN\b'
  - '(?iu)(?:ICAO\s*(?:CODE)?\s*:\s*XAX\b|AIRASIA\s+X)'
  - '(?iu)IATA\s+SCHEDULE\s+SEASON'
permit:
  pattern: '(?iu)\b(?:OF\s*-?\s*)(?<number>\d{1,5})\s*/\s*(?<version>[A-Z])\s*/\s*(?<season>S)\s*/\s*(?<year>20\d{2})VN\b'
  numberGroup: number
  sourceTemplate: 'OF-{number}/{version}/{season}/{year}VN'
  normalizedTemplate: 'O/F {number}{version}/{season}/CHK/{year}'
  zeroPadGroups:
    number: 4
permitDate:
  source: RAW
  pattern: '(?iu)(?:HANOI|HA\s+NOI)\s*,?\s*(?<date>\d{1,2}\s+[A-Z]{3}\s+20\d{2}|\d{1,2}/\d{1,2}/20\d{2})'
  group: date
  formats: [d MMM uuuu, d/M/uuuu]
  locale: en
operator:
  fixedValue: XAX
billingAddress:
  source: TABLE
  pattern: '(?iu)(?:POSTAL\s+ADDRESS|ADDRESS)\s*:\s*(?<value>[^\n]+)'
  group: value
  required: false
schedule:
  columns:
    flightNumber: [Flight number, Flight number(1)]
    effectiveFrom: [Effective from, Effective from(2)]
    effectiveTo: [Effective to, Effective to(3)]
    serviceDays: [Days of services, Days of services(4)]
    fromAirport: [Departure Airport, Departure Airport(5)]
    etd: [ETD, ETD(6)]
    toAirport: [Arrival Airport, Arrival Airport(7)]
    eta: [ETA, ETA(8)]
  requiredColumns: [flightNumber, effectiveFrom, effectiveTo, serviceDays, fromAirport, etd, toAirport]
  excludeColumns: []
  dateFormats: [dMMMyy, d-MMM-yy, d-MMM-uuuu, d/M/uuuu]
  timeFormats: [HHmm, H:mm, HH:mm]
  locale: en
  purposeId: PAX
  includeEta: true
route:
  columns:
    sector: [Sector, Sector(15)]
    airways: [Airways, Airways(16)]
  requiredColumns: [sector, airways]
  tableRequired: true
  allowEmpty: false
  fallbackToFirst: false
  filterSchedule: true
aircraft:
  scheduleColumn: aircraftType
  auxiliaryColumns:
    aircraftType: [Aircraft Type, Aircraft Type (10)]
    registrationMarks: [Registration Mark, Registration Mark (11)]
  auxiliaryRequiredColumns: []
  auxiliaryTypeColumn: aircraftType
  defaultType: A330
  remarkPrefix: PAX
validation:
  allowIataAirports: false
