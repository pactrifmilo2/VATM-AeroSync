id: spa066-vietnamese-landing-revision
detectionPatterns:
  - '(?iu)PHÉP\s+BAY\s+KHÔNG\s+THƯỜNG\s+LỆ\s+ĐI/ĐẾN\s+VIỆT\s+NAM'
  - '(?iu)2\.2\.\s*LỊCH\s+BAY\s+MỚI'
permit:
  pattern: '(?iu)\bLD-(?<number>\d{1,5})/(?<month>\d{1,2})/(?<year>20\d{2})VN(?:-REV(?<revision>\d+))?\b'
  numberGroup: number
  normalizedTemplate: 'LD-{number}/{month}/{year}'
  zeroPadGroups:
    month: 2
permitDate:
  source: PARAGRAPH
  pattern: '(?iu)HÀ\s*NỘI,\s*(?<date>\d{1,2}/\d{1,2}/20\d{2})'
  group: date
  formats: [d/M/uuuu]
  locale: vi
operator:
  source: TABLE
  pattern: '(?iu)MÃ\s*ICAO:\s*(?<value>[A-Z0-9]{3})'
  group: value
  required: true
billingAddress:
  source: TABLE
  pattern: '(?iu)ĐỊA\s+CHỈ\s+BƯU\s+ĐIỆN:\s*(?<value>[^\n]+)'
  group: value
  required: false
referenceColumn: originalPermit
master:
  authorId: CHK
  permitType: LD
  version: A
  season: S
  validHours: 24
  flightType: SC
schedule:
  columns:
    flightNumber: [Số hiệu chuyến bay, Flight number]
    effectiveFrom: [Hiệu lực từ, Effective from]
    effectiveTo: [Hiệu lực đến, Effective to]
    serviceDays: [Ngày trong tuần, Days of services]
    fromAirport: [Sân bay cất cánh, Departure airport]
    etd: [Giờ khởi hành dự kiến, ETD]
    toAirport: [Sân bay hạ cánh, Arrival airport]
    eta: [Giờ dự kiến hạ cánh, ETA]
    aircraftType: [Loại tàu bay, Aircraft type]
    originalPermit: [Số phép bay đã cấp, Original permit]
  requiredColumns:
    - flightNumber
    - effectiveFrom
    - effectiveTo
    - serviceDays
    - fromAirport
    - etd
    - toAirport
    - eta
    - aircraftType
  # Select section 2.2 by its preceding heading even when both tables share headers.
  excludeColumns: []
  tableContextPatterns:
    - '(?iu)2\.2\.\s*LỊCH\s+BAY\s+MỚI\s*\(SỬA\s+ĐỔI\)'
  dateFormats:
    - d/M/uuuu
    - d-MMM-yy
    - dMMMyy
  timeFormats:
    - HHmm
    - H:mm
    - HH:mm
  locale: en
  purposeId: PAX
  includeEta: true
route:
  columns:
    sector: [Chặng bay, Sector]
    airways: [Đường hàng không, Airways]
  requiredColumns: [sector, airways]
  tableRequired: false
  allowEmpty: true
  fallbackToFirst: false
aircraft:
  scheduleColumn: aircraftType
  auxiliaryColumns: {}
  auxiliaryRequiredColumns: []
  remarkPrefix: PAX
validation:
  allowIataAirports: true
