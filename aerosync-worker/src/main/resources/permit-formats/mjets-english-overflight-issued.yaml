id: mjets-english-overflight-issued
extends: caav-generic-overflight-issued
priority: 240
detectionPatterns:
  - '(?iu)\b(?:O\s*/\s*F|OF)\s*-?\s*\d{1,5}\s*/\s*\d{1,2}\s*/\s*20\d{2}\s*VN\b'
  - '(?iu)\b(?:MJETS\s+(?:LIMITED|AIR)|MJJ\d{2,5})\b'
  - '(?iu)\b(?:SCHEDULES?|FLIGHT\s+NUMBER)\b'
  - '(?isu)^(?!.*(?:\bREV(?:ISION)?\s*\d+\b|\bRVS\s*\d+\b)).*$'
operator:
  fixedValue: KXP
purpose:
  defaultId: PAX
  mappings:
    - pattern: '(?iu)\b(?:MEDICAL|MEDEVAC|AMBULANCE)\b'
      value: MED
    - pattern: '(?iu)\b(?:CHARTER|PASSENGER|PAX|PRIVATE)\b'
      value: PAX
aircraft:
  remarkPrefix: ''
