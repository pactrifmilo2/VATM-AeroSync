id: vjc-caav-seasonal-landing-issued
extends: airline-generic-seasonal-landing-issued
priority: 210
detectionPatterns:
  - '(?iu)\bLD\s*[-/]?\s*\d{1,9}\s*/?\s*[A-Z]\s*/\s*[SW]\s*/\s*20\d{2}\s*VN'
  - '(?iu)(?:ICAO\s*(?:CODE)?|M(?:ã|Ã|A)\s*ICAO)\s*:\s*VJC\b'
  - '(?iu)(?:IATA\s*(?:CODE)?|M(?:ã|Ã|A)\s*IATA)\s*:\s*VJ\b'
  - '(?iu)(?:SCHEDULES?|LỊCH\s+BAY)'
  - '(?isu)^(?!.*(?:\bREV(?:ISION)?\s*\d+\b|\bRVS\s*\d+\b|/\s*REV\d+\b)).*$'
operator:
  fixedValue: VJC
schedule:
  columns:
    effectiveFrom: [Effective from, Eff from, Hiệu lực từ]
    effectiveTo: [Effective to, Hiệu lực đến]
    serviceDays: [Days of services, Ngày trong tuần]
    departureAirport: [Departure Airport, Sân bay cất cánh]
    etd: [ETD, EOBT, Giờ khởi hành dự kiến]
    arrivalAirport: [Arrival Airport, Sân bay hạ cánh]
    eta: [ETA, EIBT, Giờ hạ cánh dự kiến]
validation:
  allowIataAirports: true
route:
  inlineRules:
  - pattern: '(?imu)(?<route>[A-Z]{3,4}(?:\s*[-\u2013\u2014]\s*[A-Z]{3,4})+)\s*:\s*(?<airways>[^;\r\n]+)'
    routeGroup: route
    valueGroup: airways
