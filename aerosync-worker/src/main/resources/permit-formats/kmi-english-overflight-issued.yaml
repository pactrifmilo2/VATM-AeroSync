id: kmi-english-overflight-issued
extends: caav-generic-overflight-issued
priority: 200
detectionPatterns:
  - '(?iu)\b(?:O\s*/\s*F|OF)\s*-\s*\d+'
  - '(?iu)(?:ICAO\s*(?:CODE)?[ \t]*:[ \t]*KMI\b|\bKMI\d+[A-Z0-9]*\b)'
  - '(?isu)^(?!.*(?:/|-)\s*REV\d+\b).*$'
operator:
  fixedValue: KMI
schedule:
  # K-Mile schedules publish an ETA column (OF-6517: 1800/2235); the generic
  # base profile drops it, which saved T_PERMDETAIL_SC rows with ETA null.
  includeEta: true
