id: lao-caav-inline-overflight-issued
extends: caav-generic-overflight-issued
priority: 40
detectionPatterns:
  - '(?iu)\b(?:O\s*/\s*F|OF)\s*-\s*\d{1,5}\s*/\s*\d{1,2}\s*/\s*20\d{2}\s*VN\b'
  - '(?iu)ICAO\s*(?:CODE)?\s*:\s*LAO\b'
  - '(?iu)SCHEDULES?'
  - '(?isu)^(?!.*(?:\bREV(?:ISION)?\s*\d+\b|\bRVS\s*\d+\b)).*$'
operator:
  fixedValue: LAO
permitDate:
  source: PARAGRAPH
  pattern: '(?iu)HANOI\s*,\s*(?<date>\d{1,2}-(?:[A-Z]{3}|\d{1,2})-\d{2,4})'
  formats: [d-MMM-uu, d-MMM-uuuu, d-MM-uu, d-MM-uuuu]
schedule:
  includeEta: true
aircraft:
  defaultType: ''
