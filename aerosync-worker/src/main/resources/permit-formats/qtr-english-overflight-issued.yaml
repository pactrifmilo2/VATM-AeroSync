id: qtr-english-overflight-issued
extends: caav-generic-overflight-issued
priority: 200
detectionPatterns:
  - '(?iu)\b(?:O\s*/\s*F|OF)\s*-\s*\d{1,9}'
  - '(?iu)(?:ICAO\s*(?:CODE)?[ \t]*:[ \t]*QTR\b|QATAR\s+AIRWAYS|QATAR\s+CARGO)'
  - '(?isu)^(?!.*(?:/|-)\s*REV\d+\b).*$'
operator:
  fixedValue: QTR
schedule:
  includeEta: true
aircraft:
  scheduleColumn: aircraftType
  defaultType: B77L
  auxiliaryRequiredColumns: []
