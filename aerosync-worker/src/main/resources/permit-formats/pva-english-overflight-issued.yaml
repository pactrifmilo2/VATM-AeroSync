id: pva-english-overflight-issued
extends: caav-generic-overflight-issued
priority: 220
detectionPatterns:
  - '(?iu)\b(?:O\s*/\s*F|OF)\s*-\s*\d{1,9}\s*/\s*\d{1,2}\s*/\s*20\d{2}\s*VN'
  - '(?iu)ICAO\s*(?:CODE)?\s*:\s*PVA\b'
  - '(?isu)^(?!.*(?:\bREV(?:ISION)?\s*\d*\b|\bRVS\s*\d*\b|/\s*REV\d+\b)).*$'
operator:
  fixedValue: PVA
aircraft:
  auxiliaryColumns:
    aircraftType: [Aircraft Type]
    registrationMarks: [Registration Mark, Registration Marks, Aircraft registration marks]
  auxiliaryRequiredColumns: [aircraftType]
  auxiliaryTypeColumn: aircraftType
  defaultType: GLF4
