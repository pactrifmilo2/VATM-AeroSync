spring:
  config:
    import: optional:file:${AEROSYNC_CONFIG_DIR:${user.dir}}/.env[.properties]
  application:
    name: aerosync-worker

  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/XEPDB1
    username: vatm_user
    password: vatm_password
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  amqp:
    deserialization:
      trust:
        all: true
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 120000
          multiplier: 2.0
          max-interval: 480000

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
        jdbc:
          batch_size: 50
        hbm2ddl:
          jdbc_metadata_extraction_strategy: individually
        order_inserts: true
        order_updates: true
      jakarta:
        persistence:
          database-product-name: Oracle
          database-major-version: 21
          database-minor-version: 3

app:
  atfm:
    url: ${APP_ATFM_DATASOURCE_URL:}
    username: ${APP_ATFM_DATASOURCE_USERNAME:}
    password: ${APP_ATFM_DATASOURCE_PASSWORD:}
    write-enabled: ${APP_ATFM_WRITE_ENABLED:false}
    permit-lock-seconds: ${APP_ATFM_PERMIT_LOCK_SECONDS:600}
    aircraft-cache-ttl-seconds: ${APP_ATFM_AIRCRAFT_CACHE_TTL_SECONDS:300}
  file-paths:
    incoming: C:/vatm-storage/incoming
    processed: C:/vatm-storage/processed
    error: C:/vatm-storage/error
    quarantine: C:/vatm-storage/quarantine
  worker:
    max-file-size-bytes: 10485760
    processed-retention-days: 60
    error-retention-days: 90
    lock-ttl-seconds: 600
  rabbit:
    file-ingested-exchange: file.ingested
    file-processing-routing-key: file.processing
    file-processing-queue: file.processing.queue
    sync-result-exchange: sync.result
