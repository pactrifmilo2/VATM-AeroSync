spring:
  datasource:
    url: jdbc:h2:mem:worker;MODE=Oracle;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: true
      jakarta:
        persistence:
          database-product-name: H2
          database-major-version: 2
          database-minor-version: 4

app:
  atfm:
    write-enabled: false
  file-paths:
    incoming: ${java.io.tmpdir}/aerosync-worker-test-incoming
    processed: ${java.io.tmpdir}/aerosync-worker-test-processed
    error: ${java.io.tmpdir}/aerosync-worker-test-error
    quarantine: ${java.io.tmpdir}/aerosync-worker-test-quarantine
  worker:
    max-file-size-bytes: 1048576
    processed-retention-days: 60
    error-retention-days: 90
  rabbit:
    file-processing-queue: file.processing.queue
    sync-result-exchange: sync.result
    permit-training-validation-queue: permit.training.validation.queue
    permit-profile-validation-queue: permit.profile.validation.queue
    permit-profile-canary-queue: permit.profile.canary.queue
