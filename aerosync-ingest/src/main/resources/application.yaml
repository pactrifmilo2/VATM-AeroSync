spring:
  config:
    import: optional:file:${AEROSYNC_CONFIG_DIR:${user.dir}}/.env[.properties]
  application:
    name: aerosync-ingest

  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/XEPDB1
    username: vatm_user
    password: vatm_password
    driver-class-name: oracle.jdbc.OracleDriver

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  amqp:
    deserialization:
      trust:
        all: true

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
        hbm2ddl:
          jdbc_metadata_extraction_strategy: individually
      jakarta:
        persistence:
          database-product-name: Oracle
          database-major-version: 21
          database-minor-version: 3

app:
  file-paths:
    incoming: C:/vatm-storage/incoming
    processed: C:/vatm-storage/processed
    error: C:/vatm-storage/error
    quarantine: C:/vatm-storage/quarantine
  ingest:
    max-files-per-cycle: 100
    scheduler-fixed-delay-ms: 300000
  email:
    host: localhost
    port: 993
    username:
    password:
    protocol: imaps
    folder: INBOX
    processed-folder: AeroSync/Processed
    error-folder: AeroSync/Error
    oldest-messages-per-cycle: 5
    mailbox-scan-window-size: 500
    acknowledgement-enabled: ${APP_EMAIL_ACKNOWLEDGEMENT_ENABLED:false}
    blacklist-senders: []
    connection-timeout-ms: 10000
  rabbit:
    file-ingested-exchange: file.ingested
    file-processing-routing-key: file.processing
    file-processing-queue: file.processing.queue
    sync-result-exchange: sync.result
    email-acknowledgement-queue: email.acknowledgement.queue
