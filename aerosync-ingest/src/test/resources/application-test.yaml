spring:
  datasource:
    url: jdbc:h2:mem:ingest;MODE=Oracle;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  file-paths:
    incoming: ${java.io.tmpdir}/aerosync-test-incoming
    processed: ${java.io.tmpdir}/aerosync-test-processed
    error: ${java.io.tmpdir}/aerosync-test-error
    quarantine: ${java.io.tmpdir}/aerosync-test-quarantine
  ingest:
    max-files-per-cycle: 100
    scheduler-fixed-delay-ms: 300000
  email:
    whitelist-senders:
      - ops@vatm.local
