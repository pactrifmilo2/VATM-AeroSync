server:
  port: 8080

spring:
  config:
    import: optional:file:${AEROSYNC_CONFIG_DIR:${user.dir}}/.env[.properties]
  application:
    name: aerosync-api

  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/XEPDB1
    username: vatm_user
    password: vatm_password
    driver-class-name: oracle.jdbc.OracleDriver

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  amqp:
    deserialization:
      trust:
        all: true

  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
        default_batch_fetch_size: 100
        hbm2ddl:
          jdbc_metadata_extraction_strategy: individually
      jakarta:
        persistence:
          database-product-name: Oracle
          database-major-version: 21
          database-minor-version: 3

app:
  api:
    defaults:
      scheduler-fixed-delay-ms: 300000
      max-files-per-cycle: 100
      blacklist-senders:
        - ops@vatm.local
  security:
    bootstrap-admin:
      username: ${APP_BOOTSTRAP_ADMIN_USERNAME:}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
  rabbit:
    sync-result-exchange: sync.result
    dashboard-alerts-queue: dashboard.alerts.queue
    file-ingested-exchange: file.ingested
    file-processing-routing-key: file.processing
    permit-review-publish-exchange: permit.review.publish
    permit-review-publish-routing-key: permit.review.publish
