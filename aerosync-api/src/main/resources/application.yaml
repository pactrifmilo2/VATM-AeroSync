server:
  port: 8080

spring:
  config:
    import: optional:file:${AEROSYNC_CONFIG_DIR:${user.dir}}/.env[.properties]
  application:
    name: aerosync-api

  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/XEPDB1
    username: vatm_user
    password: vatm_password
    driver-class-name: oracle.jdbc.OracleDriver

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  amqp:
    deserialization:
      trust:
        all: true

  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
        default_batch_fetch_size: 100
        hbm2ddl:
          jdbc_metadata_extraction_strategy: individually
      jakarta:
        persistence:
          database-product-name: Oracle
          database-major-version: 21
          database-minor-version: 3

app:
  file-paths:
    training: ${APP_FILE_PATHS_TRAINING:C:/vatm-storage/training}
  api:
    defaults:
      scheduler-fixed-delay-ms: 300000
      max-files-per-cycle: 100
      blacklist-senders:
        - ops@vatm.local
  security:
    legacy-users:
      admin-username: ${APP_LEGACY_ADMIN_USERNAME:admin}
      permit-menu-id: ${APP_LEGACY_PERMIT_MENU_ID:403}
  permit-training:
    minimum-evidence: ${APP_PERMIT_TRAINING_MINIMUM_EVIDENCE:2}
    require-corpus-validation: ${APP_PERMIT_TRAINING_REQUIRE_CORPUS_VALIDATION:true}
  permit-review-test-ui:
    enabled: ${APP_PERMIT_REVIEW_TEST_UI_ENABLED:false}
  rabbit:
    sync-result-exchange: sync.result
    dashboard-alerts-queue: dashboard.alerts.queue
    file-ingested-exchange: file.ingested
    file-processing-routing-key: file.processing
    permit-review-publish-exchange: permit.review.publish
    permit-review-publish-routing-key: permit.review.publish
    permit-training-validation-exchange: permit.training.validation
    permit-training-validation-routing-key: permit.training.validation
    permit-profile-validation-exchange: permit.profile.validation
    permit-profile-validation-routing-key: permit.profile.validation
