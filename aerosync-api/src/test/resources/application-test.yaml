spring:
  datasource:
    url: jdbc:h2:mem:aerosync-api;MODE=Oracle;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

  rabbitmq:
    listener:
      simple:
        auto-startup: false

app:
  api:
    defaults:
      scheduler-fixed-delay-ms: 300000
      max-files-per-cycle: 100
      blacklist-senders:
        - ops@vatm.local
