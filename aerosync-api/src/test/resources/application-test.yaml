spring:
  datasource:
    url: jdbc:h2:mem:aerosync-api;MODE=Oracle;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: true
      jakarta:
        persistence:
          database-product-name: H2
          database-major-version: 2
          database-minor-version: 4

  rabbitmq:
    listener:
      simple:
        auto-startup: false

app:
  api:
    defaults:
      scheduler-fixed-delay-ms: 300000
      max-files-per-cycle: 100
      blacklist-senders:
        - ops@vatm.local
