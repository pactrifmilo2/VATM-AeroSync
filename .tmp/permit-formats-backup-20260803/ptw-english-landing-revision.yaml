id: ptw-english-landing-revision
extends: caav-generic-landing-revision
priority: 200
detectionPatterns:
  - '(?iu)\bLD\s*-\s*\d+'
  - '(?iu)(?:ICAO\s*(?:CODE)?[ \t]*:[ \t]*PTW\b|\bPTW\d+[A-Z0-9]*\b|PATTAYA\s+AIRWAYS)'
  - '(?iu)(?:/|-)\s*REV\d+\b'
operator:
  fixedValue: PTW
validation:
  reviewOnly: false
