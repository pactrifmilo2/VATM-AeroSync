id: igt-english-overflight-scheduled
extends: caav-english-overflight-scheduled
priority: 210
detectionPatterns:
  - '(?iu)\b(?:O\s*/\s*F|OF)\s*-\s*\d+'
  - '(?iu)(?:ICAO\s*(?:CODE)?[ \t]*:[ \t]*IGT\b|\bIGT\d+[A-Z0-9]*\b)'
  - '(?iu)GENERAL\s+CARGO\s+FLIGHT'
  - '(?isu)^(?!.*NON[-\s]+SCHEDULED).*$'
operator:
  fixedValue: IGT
