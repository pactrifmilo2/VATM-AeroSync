id: kar-english-landing-revision
priority: 250
detectionPatterns:
  - '(?iu)REVISION\s+OF\s+LANDING/OVERFLIGHT\s+PERMIT'
  - '(?iu)ICAO\s*(?:CODE)?\s*:\s*KAR\b'
  - '(?iu)\bLD\s*-\s*\d{1,5}\s*/\s*\d{1,2}\s*/\s*20\d{2}\s*VN\s*/\s*REV\d+\b'
permit:
  pattern: '(?iu)\bLD\s*-\s*(?<number>\d{1,5})\s*/\s*(?<month>\d{1,2})\s*/\s*(?<year>20\d{2})\s*VN\s*/\s*REV(?<revision>\d+)\b'
  numberGroup: number
  sourceTemplate: 'LD-{number}/{month}/{year}VN/REV{revision}'
  normalizedTemplate: 'LD {number}/S/CHK/{year}'
  zeroPadGroups:
    number: 5
permitDate:
  source: PARAGRAPH
  pattern: '(?iu)HANOI\s*,\s*(?<date>\d{1,2}/\d{1,2}/20\d{2})'
  group: date
  formats: [d/M/uuuu]
  locale: en
operator:
  source: RAW
  pattern: '(?iu)ICAO\s*(?:CODE)?\s*:\s*(?<value>KAR)\b'
  group: value
  required: true
billingAddress:
  source: TABLE
  pattern: '(?iu)POSTAL\s+ADDRESS\s*:\s*(?<value>[^\n]+)'
  group: value
  required: false
referenceColumn: originalPermit
purpose:
  defaultId: PAX
  mappings:
    - pattern: '(?iu)\bCARGO\b|\bFREIGHTER\b'
      value: CAR
    - pattern: '(?iu)\bFERR?Y\b'
      value: FER
    - pattern: '(?iu)\bTECH(?:NICAL)?\s*STOP\b|\bREFUEL'
      value: OTH
    - pattern: '(?iu)\bBUSINESS\b'
      value: BUS
master:
  authorId: CHK
  permitType: LD
  version: A
  season: S
  validHours: 24
  flightType: 'NO'
schedule:
  columns:
    flightNumber: [Flight number]
    effectiveFrom: [Effective from]
    effectiveTo: [Effective to]
    serviceDays: [Days of services]
    fromAirport: [Departure Airport]
    etd: [ETD]
    toAirport: [Arrival Airport]
    eta: [ETA]
    aircraftType: [Aircraft Type]
    originalPermit: [Original permit]
  requiredColumns: [flightNumber, effectiveFrom, effectiveTo, serviceDays, fromAirport, etd, toAirport, eta, aircraftType]
  excludeColumns: [originalPermit]
  tableContextPatterns: []
  dateFormats: [dMMMyy, d-MMM-yy]
  timeFormats: [HHmm, H:mm, HH:mm]
  locale: en
  purposeId: PAX
  includeEta: true
  inferIataPrefix: true
route:
  columns:
    sector: [Sector]
    airways: [Airways]
  requiredColumns: [sector, airways]
  tableRequired: true
  allowEmpty: false
  fallbackToFirst: false
  filterSchedule: true
aircraft:
  scheduleColumn: aircraftType
  auxiliaryColumns:
    aircraftType: [Aircraft Type]
    registrationMarks: [Registration Mark, Registration Marks]
  auxiliaryRequiredColumns: [aircraftType, registrationMarks]
  auxiliaryTypeColumn: aircraftType
  remarkPrefix: ''
validation:
  allowIataAirports: true
  reviewOnly: true
